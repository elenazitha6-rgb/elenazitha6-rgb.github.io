# 推送到 main 就自动检查、构建并发布到 GitHub Pages。
# 第一次使用:仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 定时发布(滴灌):每篇文章的 pubDate 是各自随机的时刻(不是整点、间隔也不固定),晚于构建时刻的文章不生成(见 src/lib/posts.ts)。
  # 每小时的第 23 分钟重新构建一次(避开整点的排队高峰),文章在 pubDate 之后的第一次构建里出现,所以实际上线时间离 pubDate 不超过一小时多一点;
  # 没有新文章的小时页面内容不变,IndexNow 也只推有变化的页面。
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只发布一次,新的推送排队等前一次发布完成(不取消正在进行的发布)。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 类型检查(Astro 组件 + TypeScript);内容检查由 `npm run build` 的第一步完成。
      - run: npm run check

      - run: npm run build
        env:
          # 换自定义域名时,在仓库 Settings → Secrets and variables → Actions → Variables 里设 SITE_URL。
          SITE_URL: ${{ vars.SITE_URL }}
          # 站长平台的验证码(选填,在同一个 Variables 页面设置):对应页面 <head> 里的验证 meta 标签。
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}

      # 检查构建产物:hreflang 互链、canonical、sitemap 和页面一一对应、站内链接 / 资源 404、结构化数据和可见内容一致
      - run: npm run check:seo

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      # 新的 sitemap 留给发布后的 IndexNow 推送用(和上次推送的状态对比,只推新增 / 更新的页面)
      - uses: actions/upload-artifact@v4
        with:
          name: sitemap
          path: dist/sitemap.xml
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 发布成功后,把新增 / 更新的页面推给 IndexNow(Bing、Yandex、Naver、Seznam)。
  # 推送记录放在 Actions 缓存里(部署目录之外),所以每次只推有变化的页面,不会全站重推。
  # 缓存键带 v2:文章改成定时发布后 sitemap 页面数从 42 骤降到 8,旧记录(42 条)会让脚本的「页面数骤降」保护一直拦住推送,换键等于清空旧记录。
  # 不需要时在仓库 Variables 里设 INDEXNOW_DISABLED=true。
  indexnow:
    needs: deploy
    if: ${{ vars.INDEXNOW_DISABLED != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: sitemap
          path: .indexnow-in

      - uses: actions/cache/restore@v4
        with:
          path: .indexnow
          key: indexnow-state-v2-${{ github.run_id }}
          restore-keys: indexnow-state-v2-

      - run: node scripts/indexnow.mjs --sitemap .indexnow-in/sitemap.xml --state .indexnow/state.json
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - uses: actions/cache/save@v4
        if: ${{ success() }}
        with:
          path: .indexnow
          key: indexnow-state-v2-${{ github.run_id }}
